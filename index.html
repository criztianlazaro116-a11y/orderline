<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - N&D Delight's</title>
    <style>
        body {
            background-color: #ffffff;
            color: #af876b; /* Light Brown Color */
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p.description {
            font-size: 18px;
            color: #333333; /* Dark color for better readability of body text */
            margin-top: 0;
            margin-bottom: 30px;
        }

        .maintenance-icon {
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        footer {
            font-size: 16px;
            position: fixed;
            bottom: 30px;
            color: #333333;
        }

        footer strong {
            color: #af876b; /* Accent color for the name */
        }
    </style>
</head>
<body>
    <h1>N&D Delight's is Under maintenance</h1>
    <p class="description">We are working hard to enhance your experience. Please check back soon.</p>
    
    <!-- Link to the image of the person working -->
    <img src="maintenance-illustration.png" alt="System administrator working on server" class="maintenance-icon">
    
    <footer>Developed by <strong>Criztian Dave A. Lazaro</strong></footer>
</body>
</html>
